spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.application.name=quality-controll-app

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Europe/Minsk
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=com.vadimsjjs.qualitycontrollapp.config.Oracle11gDialect

spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.servlet.content-type=text/html;charset=UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
server.servlet.encoding.force-request=true
server.servlet.encoding.force-response=true


server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json

# ===== ПРАВА ДОСТУПА =====
# true  - любой вошедший пользователь может просматривать, добавлять, редактировать
#         и удалять записи о несоответствующей продукции (справочники тоже).
# false - действуют роли из справочника персонала V_PERSONAL_STPC2.ROLE_NAME:
#         ОТК/ППБ - правка, старший ОТК/администратор - удаление,
#         роль FULL_ACCESS - полный доступ отдельному сотруднику.
app.security.full-access=${APP_SECURITY_FULL_ACCESS:true}

# ===== HTTPS / TLS =====
server.ssl.enabled=${SSL_ENABLED:true}
server.ssl.key-store-type=${SSL_STORE_TYPE:PKCS12}
server.ssl.key-store=${SSL_STORE:${SERVER_SSL_KEY_STORE:classpath:keystore/keystore.p12}}
server.ssl.key-store-password=${SSL_PASSWORD:${SSL_PASS:${SERVER_SSL_KEY_STORE_PASSWORD:changeit}}}
server.ssl.key-password=${SSL_KEY_PASSWORD:${SSL_PASS:${SSL_PASSWORD:${SERVER_SSL_KEY_STORE_PASSWORD:changeit}}}}
server.ssl.key-alias=${SSL_KEY_ALIAS:${SSL_ALIAS:${SERVER_SSL_KEY_ALIAS:qualitycontrollapp}}}
server.address=${SERVER_ADDRESS:}
server.port=${SERVER_PORT:8082}
server.ssl.protocol=TLS
server.ssl.enabled-protocols=TLSv1.2,TLSv1.3


# Таймаут сессии (15 минут = 900 секунд)
server.servlet.session.timeout=900
spring.session.timeout=900

# Для старых браузеров
spring.resources.cache.period=0
spring.resources.chain.cache=false

spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/css/**,/js/**,/fonts/**,/lib/**

spring.aop.auto=true
spring.aop.proxy-target-class=true

spring.main.allow-bean-definition-overriding=true
#debug=true