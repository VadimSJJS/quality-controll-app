<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Учёт несоответствующей продукции</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/login.css}">
    <style>
        .remember-me {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 12px 0 20px 0;
        }
        .remember-me input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #1a3a5c;
            cursor: pointer;
            margin: 0;
            flex-shrink: 0;
        }
        .remember-me label {
            font-size: 14px;
            color: #475569;
            cursor: pointer;
            user-select: none;
            margin: 0;
        }
        .remember-me label:hover {
            color: #1a3a5c;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .input-wrapper {
            position: relative;
        }
        .input-wrapper .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 18px;
        }
        .input-wrapper .form-control {
            padding-left: 44px;
            height: 48px;
            border-radius: 10px;
            border: 1.5px solid #e2e8f0;
            transition: all 0.2s;
            font-size: 15px;
        }
        .input-wrapper .form-control:focus {
            border-color: #1a3a5c;
            box-shadow: 0 0 0 3px rgba(26, 58, 92, 0.1);
        }
        .input-wrapper .form-control.is-invalid {
            border-color: #dc2626;
        }
        .btn-login {
            background: #1a3a5c;
            color: white;
            padding: 14px;
            font-weight: 600;
            width: 100%;
            border: none;
            border-radius: 10px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 4px;
        }
        .btn-login:hover {
            background: #0f2a44;
            color: white;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(26, 58, 92, 0.3);
        }
        .btn-login:active {
            transform: translateY(0);
        }
        .alert-custom {
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }
        .alert-danger-custom {
            background: #fee2e2;
            color: #dc2626;
        }
        .alert-success-custom {
            background: #dcfce7;
            color: #16a34a;
        }
        .login-container {
            display: flex;
            min-height: 100vh;
        }
        .brand-panel {
            flex: 1;
            background: linear-gradient(135deg, #1a3a5c 0%, #2a5a8c 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }
        .brand-content {
            color: white;
            max-width: 400px;
        }
        .brand-logo {
            font-size: 36px;
            font-weight: 700;
            letter-spacing: -1px;
            margin-bottom: 16px;
        }
        .brand-logo .accent {
            color: #e8b830;
        }
        .brand-description {
            font-size: 16px;
            opacity: 0.85;
            line-height: 1.6;
        }
        .form-panel {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8fafc;
            padding: 40px;
        }
        .form-wrapper {
            background: white;
            padding: 48px 40px;
            border-radius: 20px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.06);
            max-width: 420px;
            width: 100%;
        }
        .mobile-brand {
            display: none;
            text-align: center;
            margin-bottom: 32px;
        }
        .mobile-brand .brand-logo {
            font-size: 28px;
            color: #1a3a5c;
        }
        .form-header {
            margin-bottom: 32px;
        }
        .form-header h2 {
            font-size: 28px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 8px;
        }
        .form-header p {
            color: #64748b;
            font-size: 15px;
            margin: 0;
        }
        .form-footer {
            margin-top: 28px;
            text-align: center;
            font-size: 13px;
            color: #94a3b8;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .form-footer i {
            font-size: 16px;
        }
        .form-label {
            font-weight: 600;
            font-size: 13px;
            color: #475569;
            margin-bottom: 6px;
        }
        @media (max-width: 768px) {
            .login-container {
                flex-direction: column;
            }
            .brand-panel {
                display: none;
            }
            .mobile-brand {
                display: block;
            }
            .form-panel {
                padding: 20px;
            }
            .form-wrapper {
                padding: 32px 24px;
            }
        }
    </style>
</head>
<body>

<div class="login-container">
    <div class="brand-panel">
        <div class="brand-content">
            <div class="brand-logo">
                БМЗ <span class="accent">СтПЦ-2</span>
            </div>
            <p class="brand-description">
                Единая система учёта, контроля и управления несоответствующей продукцией предприятия.
            </p>
        </div>
    </div>

    <div class="form-panel">
        <div class="form-wrapper">
            <div class="mobile-brand">
                <div class="brand-logo">
                    БМЗ <span class="accent">СтПЦ-2</span>
                </div>
            </div>

            <div class="form-header">
                <h2>С возвращением</h2>
                <p>Введите свои данные для доступа к системе</p>
            </div>

            <div th:if="${error}" class="alert-custom alert-danger-custom" role="alert">
                <i class="bi bi-exclamation-triangle-fill"></i>
                <span th:text="${error}">Неверный табельный номер или пароль</span>
            </div>

            <div th:if="${message}" class="alert-custom alert-success-custom" role="alert">
                <i class="bi bi-check-circle-fill"></i>
                <span th:text="${message}">Вы успешно вышли из системы</span>
            </div>

            <form th:action="@{/login}" method="post">
                <div class="form-group">
                    <label for="username" class="form-label">Табельный номер</label>
                    <div class="input-wrapper">
                        <input type="text"
                               class="form-control"
                               id="username"
                               name="username"
                               placeholder="Например: 12345"
                               required
                               autofocus
                               th:classappend="${error != null ? 'is-invalid' : ''}">
                        <i class="bi bi-person-badge input-icon"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Пароль</label>
                    <div class="input-wrapper">
                        <input type="password"
                               class="form-control"
                               id="password"
                               name="password"
                               placeholder="Введите ваш пароль"
                               required
                               th:classappend="${error != null ? 'is-invalid' : ''}">
                        <i class="bi bi-lock input-icon"></i>
                    </div>
                </div>


                <div class="remember-me">
                    <input type="checkbox" name="remember-me" id="remember-me">
                    <label for="remember-me">Запомнить меня на 14 дней</label>
                </div>

                <button type="submit" class="btn-login">
                    <span>Войти в систему</span>
                    <i class="bi bi-arrow-right"></i>
                </button>
            </form>

            <div class="form-footer">
                <i class="bi bi-shield-lock-fill"></i>
                <span>Система контроля качества СтПЦ-2 © 2026</span>
            </div>
        </div>
    </div>
</div>

</body>
</html>
