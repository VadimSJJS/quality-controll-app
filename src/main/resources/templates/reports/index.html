<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Отчёты</title>
</head>
<body>
<div th:replace="~{layouts/base :: layout(~{::content})}">
    <div th:fragment="content">

        <h4 class="mb-0 fw-bold text-dark">📊 Отчёты по качеству</h4>
        <p class="text-secondary small mb-4">Формирование отчётов о несоответствующей продукции</p>

        <div class="row g-4">
            <div class="col-md-6">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-body">
                        <div class="d-flex align-items-center gap-3 mb-3">
                            <div class="bg-primary bg-opacity-10 p-3 rounded-3">
                                <i class="bi bi-calendar-day fs-3 text-primary"></i>
                            </div>
                            <div>
                                <h5 class="card-title mb-0">Отчёт за сутки</h5>
                                <p class="card-text text-secondary small">Краткий отчёт за выбранную дату</p>
                            </div>
                        </div>
                        <div class="d-flex gap-2">
                            <input type="date" class="form-control form-control-sm" style="flex:1;">
                            <button class="btn btn-primary btn-sm">Сформировать</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-body">
                        <div class="d-flex align-items-center gap-3 mb-3">
                            <div class="bg-warning bg-opacity-10 p-3 rounded-3">
                                <i class="bi bi-calendar-week fs-3 text-warning"></i>
                            </div>
                            <div>
                                <h5 class="card-title mb-0">Отчёт за неделю</h5>
                                <p class="card-text text-secondary small">Детальный отчёт за последние 7 дней</p>
                            </div>
                        </div>
                        <button class="btn btn-outline-primary btn-sm">Сформировать</button>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-body">
                        <div class="d-flex align-items-center gap-3 mb-3">
                            <div class="bg-success bg-opacity-10 p-3 rounded-3">
                                <i class="bi bi-calendar-month fs-3 text-success"></i>
                            </div>
                            <div>
                                <h5 class="card-title mb-0">Отчёт за месяц</h5>
                                <p class="card-text text-secondary small">Полный отчёт по качеству за месяц</p>
                            </div>
                        </div>
                        <button class="btn btn-outline-primary btn-sm">Сформировать</button>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-body">
                        <div class="d-flex align-items-center gap-3 mb-3">
                            <div class="bg-danger bg-opacity-10 p-3 rounded-3">
                                <i class="bi bi-calendar-range fs-3 text-danger"></i>
                            </div>
                            <div>
                                <h5 class="card-title mb-0">Произвольный период</h5>
                                <p class="card-text text-secondary small">Выберите свой период для отчёта</p>
                            </div>
                        </div>
                        <div class="d-flex gap-2 flex-wrap">
                            <input type="date" class="form-control form-control-sm" style="width:130px;">
                            <span class="text-secondary small align-self-center">—</span>
                            <input type="date" class="form-control form-control-sm" style="width:130px;">
                            <button class="btn btn-primary btn-sm">Сформировать</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>
</body>
</html>
