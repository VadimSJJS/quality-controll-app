<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Аналитика</title>
</head>
<body>
<div th:replace="~{layouts/base :: layout(~{::content})}">
    <div th:fragment="content">

        <h4 class="mb-0 fw-bold text-dark">📈 Аналитика</h4>
        <p class="text-secondary small mb-4">Визуализация данных о несоответствующей продукции</p>

        <div class="row g-4">
            <div class="col-lg-6">
                <div class="card shadow-sm border-0">
                    <div class="card-body">
                        <h6 class="fw-semibold mb-3"><i class="bi bi-bar-chart-fill text-primary"></i> Диаграмма Парето</h6>
                        <div class="bg-light rounded-3 p-5 text-center text-secondary">
                            <i class="bi bi-bar-chart fs-1"></i>
                            <p class="mt-2 mb-0">Распределение по видам несоответствий</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-6">
                <div class="card shadow-sm border-0">
                    <div class="card-body">
                        <h6 class="fw-semibold mb-3"><i class="bi bi-graph-up-arrow text-success"></i> Динамика по участкам</h6>
                        <div class="bg-light rounded-3 p-5 text-center text-secondary">
                            <i class="bi bi-graph-up fs-1"></i>
                            <p class="mt-2 mb-0">Гистограмма по участкам</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-6">
                <div class="card shadow-sm border-0">
                    <div class="card-body">
                        <h6 class="fw-semibold mb-3"><i class="bi bi-pie-chart-fill text-warning"></i> Распределение по статусам</h6>
                        <div class="bg-light rounded-3 p-5 text-center text-secondary">
                            <i class="bi bi-pie-chart fs-1"></i>
                            <p class="mt-2 mb-0">Восстановлено / Ожидает / Брак</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-6">
                <div class="card shadow-sm border-0">
                    <div class="card-body">
                        <h6 class="fw-semibold mb-3"><i class="bi bi-table text-info"></i> Сводная таблица</h6>
                        <div class="bg-light rounded-3 p-5 text-center text-secondary">
                            <i class="bi bi-table fs-1"></i>
                            <p class="mt-2 mb-0">Данные по участкам и видам дефектов</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>
</body>
</html>
