<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>БМЗ · СтПЦ-2 — Учёт несоответствующей продукции</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/base.css}">
</head>
<body>

<!-- ===== TOP BAR ===== -->
<header class="topbar">
    <div class="brand">
        <div>
            <span class="logo-text">БМЗ <span class="accent">·</span> СтПЦ-2</span>
            <span class="logo-sub">Учёт несоответствующей продукции</span>
        </div>
    </div>
    <div class="user-area">
        <div class="user-info">
            <div>
                <div class="user-name" th:text="${fio}">Пользователь</div>
                <span class="user-role"
                      th:class="${roleGroup == 'ROLE_ADMIN' ? 'admin' : (roleGroup == 'ROLE_OTK' ? 'otk' : (roleGroup == 'ROLE_PPB' ? 'ppb' : 'viewer'))}"
                      th:text="${roles}">ROLE_VIEWER</span>
            </div>
        </div>
        <form th:action="@{/logout}" method="post" class="m-0">
            <button type="submit" class="btn-logout">
                <i class="bi bi-box-arrow-right"></i> Выйти
            </button>
        </form>
    </div>
</header>

<!-- ===== MAIN ===== -->
<div class="main-wrapper">

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <a th:href="@{/}" class="nav-item" th:classappend="${currentPage == 'index' ? 'active' : ''}">
            <i class="bi bi-house-door"></i> Главная
        </a>
        <a th:href="@{/defects}" class="nav-item" th:classappend="${currentPage == 'defects' ? 'active' : ''}">
            <i class="bi bi-clipboard-data"></i> Журнал несоответствий
        </a>
        <a th:href="@{/defects/add}" class="nav-item" th:classappend="${currentPage == 'add-defect' ? 'active' : ''}">
            <i class="bi bi-plus-circle"></i> Добавить запись
        </a>
        <div class="nav-divider"></div>
        <a th:href="@{/reports}" class="nav-item" th:classappend="${currentPage == 'reports' ? 'active' : ''}">
            <i class="bi bi-file-earmark-text"></i> Отчёты
        </a>
        <a th:href="@{/charts}" class="nav-item" th:classappend="${currentPage == 'charts' ? 'active' : ''}">
            <i class="bi bi-graph-up-arrow"></i> Аналитика
        </a>
        <div class="nav-divider"></div>
        <a th:href="@{/directories}" class="nav-item" sec:authorize="hasRole('ADMIN')" th:classappend="${currentPage == 'directories' ? 'active' : ''}">
            <i class="bi bi-gear"></i> Справочники
        </a>
    </aside>

    <!-- CONTENT -->
    <main class="content">

        <!-- Top Bar -->
        <div class="top-bar d-flex justify-content-between align-items-center">
            <div>
                <span class="page-title" th:text="${pageTitle}">Страница</span>
                <nav aria-label="breadcrumb" class="d-inline-block ms-3">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a th:href="@{/}" href="#">Главная</a></li>
                        <li class="breadcrumb-item active" th:text="${pageTitle}" aria-current="page">Страница</li>
                    </ol>
                </nav>
            </div>
            <div class="d-flex align-items-center gap-3">
                <span class="text-secondary small">
                    <i class="bi bi-person"></i>
                    <span sec:authentication="name"></span>
                </span>
                <span class="badge badge-role-otk" th:if="${roleGroup == 'ROLE_OTK'}">ОТК</span>
                <span class="badge badge-role-ppb" th:if="${roleGroup == 'ROLE_PPB'}">ППБ</span>
                <span class="badge badge-role-viewer" th:if="${roleGroup == 'ROLE_VIEWER'}">Просмотр</span>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content" th:fragment="content">
        <!--            Содержимое страницы     -->
        </div>

    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
