<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>БМЗ · СтПЦ-2 — Учёт несоответствующей продукции</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/layout.css}">
</head>
<body>
<div class="container-fluid p-0">
    <div class="row g-0">
        <div class="col-auto sidebar p-3">
            <div class="d-flex align-items-center gap-2 mb-4 pb-3 border-bottom border-light border-opacity-25">
                <span class="fs-4 fw-bold">БМЗ</span>
                <span class="fs-6 opacity-75">СтПЦ-2</span>
            </div>
            <nav class="nav flex-column">
                <a class="nav-link" th:href="@{/}" th:classappend="${currentPage == 'index' ? 'active' : ''}">
                    <i class="bi bi-house-door"></i> Главная
                </a>
                <a class="nav-link" th:href="@{/defects}" th:classappend="${currentPage == 'defects' ? 'active' : ''}">
                    <i class="bi bi-clipboard-data"></i> Журнал несоответствий
                </a>
                <a class="nav-link" th:href="@{/defects/add}" th:classappend="${currentPage == 'add-defect' ? 'active' : ''}">
                    <i class="bi bi-plus-circle"></i> Добавить запись
                </a>
                <a class="nav-link" th:href="@{/reports}" th:classappend="${currentPage == 'reports' ? 'active' : ''}">
                    <i class="bi bi-file-earmark-text"></i> Отчёты
                </a>
                <a class="nav-link" th:href="@{/charts}" th:classappend="${currentPage == 'charts' ? 'active' : ''}">
                    <i class="bi bi-graph-up-arrow"></i> Аналитика
                </a>
                <a class="nav-link" th:href="@{/directories}" sec:authorize="hasRole('ADMIN')" th:classappend="${currentPage == 'directories' ? 'active' : ''}">
                    <i class="bi bi-gear"></i> Справочники
                </a>
            </nav>
            <div class="mt-auto pt-4 border-top border-light border-opacity-25">
                <div class="text-white-50 small">
                    <i class="bi bi-person-circle"></i>
                    <span sec:authentication="name"></span>
                </div>
                <form th:action="@{/logout}" method="post" class="mt-2">
                    <button type="submit" class="btn btn-outline-light btn-sm w-100">
                        <i class="bi bi-box-arrow-right"></i> Выйти
                    </button>
                </form>
            </div>
        </div>

        <!-- MAIN CONTENT -->
        <div class="col ps-0">
            <!-- Top Bar -->
            <div class="top-bar d-flex justify-content-between align-items-center">
                <div>
                    <span class="page-title" th:text="${pageTitle}">Страница</span>
                    <nav aria-label="breadcrumb" class="d-inline-block ms-3">
                        <ol class="breadcrumb">
                            <li class="breadcrumb-item"><a th:href="@{/}" href="#">Главная</a></li>
                            <li class="breadcrumb-item active" th:text="${pageTitle}" aria-current="page">Страница</li>
                        </ol>
                    </nav>
                </div>
                <div class="d-flex align-items-center gap-3">
                    <span class="text-secondary small">
                        <i class="bi bi-person"></i>
                        <span sec:authentication="name"></span>
                    </span>
                    <span class="badge badge-role-otk" th:if="${roleGroup == 'ROLE_OTK'}">ОТК</span>
                    <span class="badge badge-role-ppb" th:if="${roleGroup == 'ROLE_PPB'}">ППБ</span>
                    <span class="badge badge-role-viewer" th:if="${roleGroup == 'ROLE_VIEWER'}">Просмотр</span>
                </div>
            </div>

            <!-- Content -->
            <div class="main-content">
                <div th:replace="~{::content}"></div>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
